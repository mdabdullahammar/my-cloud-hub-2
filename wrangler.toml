name = "my-private-cloud-hub"
main = "src/worker.js"
compatibility_date = "2026-11-10"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "my-private-cloud-hub"
database_id = "dcd10925-8bd2-46bc-b229-e15bc3d90215"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "my-private-cloud-hub-files"

[vars]
# Comma-separated exact browser origins. Set after choosing the final Worker URL.
ALLOWED_ORIGINS = ""
