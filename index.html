        // Monitor Icon
        return `<svg class="w-6 h-6 ${colorClass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>`;

    function showToast(title, message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        info: 'border-emerald-500/40 bg-slate-900/95 text-slate-100',
        success: 'border-emerald-500/60 bg-slate-900/95 text-emerald-100',
        warn: 'border-amber-500/50 bg-slate-900/95 text-amber-100'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto border ${colors[type] || colors.info} px-4 py-3 rounded-xl shadow-xl backdrop-blur-md fade-in flex items-start justify-between gap-3`;
      el.innerHTML = `
        <div>
          <div class="text-xs font-semibold uppercase tracking-wider opacity-80">${title}</div>
          <div class="text-sm mt-0.5">${message}</div>
        </div>
        <button class="text-slate-400 hover:text-white text-sm font-bold px-1" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(el);
      setTimeout(() => { if (el.parentElement) el.remove(); }, 4500);
    }

    // ==========================================
    // STORAGE NETWORK PRIORITY & ROUTING
    // ==========================================
    function movePriority(connId, direction) {
      const eligible = state.connectedAccounts.filter(c => c.priority !== null).sort((a, b) => a.priority - b.priority);
      const idx = eligible.findIndex(c => c.id === connId);
      if (idx === -1) return;
      const swapIdx = idx + direction;
      if (swapIdx < 0 || swapIdx >= eligible.length) return;

      const temp = eligible[idx].priority;
      eligible[idx].priority = eligible[swapIdx].priority;
      eligible[swapIdx].priority = temp;

      eligible.sort((a, b) => a.priority - b.priority).forEach((c, i) => {
        c.priority = i + 1;
        c.role = i === 0 ? 'PRIMARY' : (i === 1 ? 'SECONDARY' : 'ADDITIONAL');
        c.subtitle = i === 0 ? 'Primary Storage' : (i === 1 ? 'Secondary Storage' : 'Future / Overflow Storage');
      });

      showToast('Priority Order Updated', 'Sequential Allocation Manager updated. Old files stay in their original location.', 'info');
      render();
    }

    function updateThreshold(connId, val) {
      const conn = state.connectedAccounts.find(c => c.id === connId);
      if (!conn) return;
      conn.thresholdPct = Math.max(50, Math.min(99, parseInt(val, 10) || 85));
      render();
    }

    function toggleProviderUploadEligible(connId) {
      const conn = state.connectedAccounts.find(c => c.id === connId);
      if (!conn) return;
      conn.enabledForUploads = !conn.enabledForUploads;
      conn.statusBadge = conn.enabledForUploads ? 'Active' : 'Standby';
      render();
    }

    function computeRoutingDecision(fileSizeMB) {
      const sizeGB = fileSizeMB / 1024;
      const candidates = state.connectedAccounts
        .filter(c => c.priority !== null)
        .sort((a, b) => a.priority - b.priority);

      const trace = [];
      let selected = null;

      for (const acc of candidates) {
        const usagePct = acc.totalGB ? ((acc.usedGB + sizeGB) / acc.totalGB) * 100 : 0;
        if (!acc.enabledForUploads) {
          trace.push({ acc, decision: 'STANDBY_SKIPPED', reason: 'Paused / Standby mode' });
          continue;
        }
        if (acc.status !== 'HEALTHY') {
          trace.push({ acc, decision: 'UNAVAILABLE', reason: `Status: ${acc.status}` });
          continue;
        }
        if (acc.totalGB && usagePct > acc.thresholdPct) {
          trace.push({
            acc,
            decision: 'THRESHOLD_FULL_OVERFLOW',
            reason: `Projected ${usagePct.toFixed(1)}% exceeds ${acc.thresholdPct}% limit → Auto-switching to next storage`
          });
          continue;
        }
        if (!selected) {
          selected = acc;
          trace.push({
            acc,
            decision: 'SELECTED_TARGET',
            reason: `Active & within ${acc.thresholdPct}% limit (${usagePct.toFixed(1)}% used)`
          });
        } else {
          trace.push({
            acc,
            decision: 'STANDBY_OVERFLOW',
            reason: 'Not currently receiving backups (Standby reserve)'
          });
        }
      }
      return { selected, trace };
    }

-- 7. storage_objects (Tracks exact storage_provider_id + remote_object_key + SHA-256 checksum)
-- 8. media_files (Device-scoped folders: Camera, Screenshots, WhatsApp Images/Videos, Downloads + External Google flag)
-- 9. backup_jobs (5 WorkManager statuses: Pending, Uploading, Completed, Failed, Retry Scheduled + Local Delete Guard)
-- 10. backup_history (Append-only verified transfer ledger)
-- 11. security_audit_logs (Tamper-evident logs for lockouts, device revocations, and signed URL issuance)
            </pre>
          </div>
        </div>
      `;
    }

    // ==========================================
    // MAIN APPLICATION SHELL
    // ==========================================
    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!state.isAuthenticated) {
        app.innerHTML = renderWelcomeScreen();
        return;
      }

      if (!state.isVaultUnlocked) {
        app.innerHTML = renderVaultLockScreen();
        return;
      }

      const navItems = [
        { id: 'devices_hub', label: 'Registered Devices (Hub)', icon: '📱', badge: state.devices.length },
        { id: 'network', label: 'My Storage Network', icon: '☁️', badge: state.connectedAccounts.filter(c => c.priority !== null).length },
        { id: 'companion', label: 'Companion & WorkManager', icon: '⚡', badge: state.backupActivity.length },
        { id: 'security', label: '6-Layer Security', icon: '🛡️' },
        { id: 'connections', label: 'All 9 Providers', icon: '🔌' },
        { id: 'gallery', label: 'Unified Gallery', icon: '🖼️', badge: state.mediaFiles.length },
        { id: 'architecture', label: 'DB Schema', icon: '🗄️' }
      ];

      let mainContent = '';
      if (state.currentTab === 'devices_hub') mainContent = renderDevicesHubTab();
      else if (state.currentTab === 'network') mainContent = renderStorageNetworkTab();
      else if (state.currentTab === 'companion') mainContent = renderCompanionTab();
      else if (state.currentTab === 'security') mainContent = renderSecurityTab();
      else if (state.currentTab === 'connections') mainContent = renderConnectionsTab();
      else if (state.currentTab === 'gallery') mainContent = renderUnifiedGalleryTab();
      else if (state.currentTab === 'architecture') mainContent = renderArchitectureTab();

      app.innerHTML = `
        <div class="min-h-screen flex flex-col">
          <!-- Top Header matching "My Private Cloud Hub" -->
          <header class="sticky top-0 z-30 bg-white/95 dark:bg-[#050507]/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800/90 px-4 lg:px-8 py-3.5">
            <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('devices_hub')">
                <div class="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center text-slate-950 font-extrabold shadow">
                  ☁️
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-base sm:text-lg tracking-tight">My Private Cloud Hub</span>
                    <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                      ${state.previewDataMode === 'EMPTY' ? '0-STATE EMPTY' : 'DEVICE-FIRST PREVIEW'}
                    </span>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2">
                <button onclick="lockVaultNow()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-xs font-semibold text-amber-400" title="Authentication is not configured">
                  🔒 Security preview (inactive)
                </button>
                <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-xs">
                  ${state.darkMode ? '☀️' : '🌙'}
                </button>
                <button onclick="switchTab('security')" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-xs" title="Settings & Security">
                  ⚙️
                </button>
                <button onclick="handleLogout()" class="px-3 py-1.5 rounded-xl bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white text-xs font-semibold">
                  Sign Out
                </button>
              </div>
            </div>

            <!-- Navigation Bar -->
            <nav class="max-w-6xl mx-auto flex items-center gap-1.5 overflow-x-auto custom-scroll pt-3 pb-1">
              ${navItems.map(item => `
                <button onclick="switchTab('${item.id}')" class="px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap flex items-center gap-2 transition ${
                  state.currentTab === item.id
                    ? 'bg-emerald-500 text-slate-950 font-bold shadow-sm'
                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-900'
                }">
                  <span>${item.icon}</span>
                  <span>${item.label}</span>
                  ${item.badge !== undefined ? `<span class="px-1.5 py-0.2 rounded-full text-[10px] font-mono ${state.currentTab === item.id ? 'bg-slate-950 text-emerald-400' : 'bg-slate-200 dark:bg-slate-800 text-slate-400'}">${item.badge}</span>` : ''}
                </button>
              `).join('')}
            </nav>
          </header>

          <!-- Main Viewport -->
          <main class="flex-1 max-w-6xl w-full mx-auto px-4 lg:px-8 py-6">
            <div role="status" class="mb-5 rounded-2xl border border-amber-500/40 bg-amber-500/10 px-4 py-3 text-xs sm:text-sm text-amber-200">
              <strong>Frontend prototype only.</strong> No real sign-in, cloud provider, device, upload, backup, or database is connected.
              ${state.previewDataMode === 'DEMO' ? '<div class="mt-1 font-bold">DEMO DATA ONLY — all displayed accounts, files, devices, capacities and activity are fictional sample records.</div>' : '<div class="mt-1">Empty workspace — no sample account or file records are loaded.</div>'}
            </div>
            ${mainContent}
          </main>
        </div>
      `;
    }

    window.onload = render;
  </script>
</body>
</html>
