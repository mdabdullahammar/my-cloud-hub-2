        return `<svg class="w-6 h-6 ${colorClass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>`;

    // ==========================================
    // HELPER FUNCTIONS
    // ==========================================
    function showToast(title, message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        info: 'border-emerald-500/40 bg-slate-900/95 text-slate-100',
        success: 'border-emerald-500/60 bg-slate-900/95 text-emerald-100',
        warn: 'border-amber-500/50 bg-slate-900/95 text-amber-100'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto border ${colors[type] || colors.info} px-4 py-3 rounded-xl shadow-xl backdrop-blur-md fade-in flex items-start justify-between gap-3`;
      el.innerHTML = `
        <div>
          <div class="text-xs font-semibold uppercase tracking-wider opacity-80">${title}</div>
          <div class="text-sm mt-0.5">${message}</div>
        </div>
        <button class="text-slate-400 hover:text-white text-sm font-bold px-1" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(el);
      setTimeout(() => { if (el.parentElement) el.remove(); }, 4500);
    }

    function addAuditLog(event, detail) {
      const now = new Date().toISOString().replace('T', ' ').substring(0, 19);
      state.auditLogs.unshift({
        id: 'aud_' + Date.now(),
        time: now,
        event,
        actor: state.ownerUser.email,
        detail
      });
    }

    function toggleDarkMode() {
      state.darkMode = !state.darkMode;
      if (state.darkMode) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
      render();
    }

    const API_BASE = '';
    async function apiRequest(path, options = {}) {
      const response = await fetch(API_BASE + path, { credentials: 'same-origin', ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || ('Request failed (' + response.status + ')'));
      return data;
    }
    function setAuthMode(mode) { state.authMode = mode; state.authMessage = ''; render(); }
    async function refreshCloudData() {
      const results = await Promise.all([apiRequest('/api/devices'), apiRequest('/api/files')]);
      state.devices = (results[0].devices || []).map((d, i) => ({ id:d.id, code:'Device ' + (i+1), name:d.name, type:d.type, platformLabel:d.platform || d.type, onlineStatus:'Registered', osVersion:d.platform || 'Browser registered', googleEmail:state.ownerUser.email, deviceFingerprint:d.deviceKey, lastActive:d.lastSeenAt, backedUpFiles:0, backupSizeGB:0, lastBackupTime:'No backup yet', backupMode:'MANUAL', wifiOnly:true, folders:['Camera','Screenshots','Downloads'] }));
      state.mediaFiles = (results[1].files || []).map(f => ({ id:f.id, filename:f.name, format:f.contentType, sizeMB:(f.sizeBytes/1048576).toFixed(2), resolution:'Original file', captureDate:f.createdAt, sources:['Cloudflare R2'], note:'File metadata from private database.' }));
      render();
    }
    async function submitAuth() {
      const email = document.getElementById('auth-email')?.value?.trim();
      const password = document.getElementById('auth-password')?.value;
      const displayName = document.getElementById('auth-display-name')?.value?.trim();
      try {
        const path = state.authMode === 'register' ? '/api/auth/register' : '/api/auth/login';
        const payload = state.authMode === 'register' ? { email, password, displayName } : { email, password };
        const result = await apiRequest(path, { method:'POST', body:JSON.stringify(payload) });
        state.isAuthenticated = true;
        state.ownerUser = { id:result.user.id, name:result.user.displayName, email:result.user.email, linkedGmails:[], authProvider:'Cloudflare Worker Session', sessionId:result.user.id };
        state.currentTab = 'devices_hub'; state.authMessage = ''; await refreshCloudData();
      } catch (error) { state.authMessage = error.message; render(); }
    }
    async function bootstrap() {
      try { const health = await apiRequest('/api/health'); state.r2Status = health.storage; } catch { state.r2Status = 'unavailable'; }
      try { const result = await apiRequest('/api/auth/me'); state.isAuthenticated = true; state.ownerUser = { id:result.user.id, name:result.user.displayName, email:result.user.email, linkedGmails:[], authProvider:'Cloudflare Worker Session', sessionId:result.user.id }; await refreshCloudData(); }
      catch { render(); }
    }

        function disconnectAccount(connId) {
      const idx = state.connectedAccounts.findIndex(c => c.id === connId);

      const removed = state.connectedAccounts[idx];

      render();
    }

    async function confirmAddDevice() {
      const name=document.getElementById('new-dev-name')?.value?.trim(); const type=document.getElementById('new-dev-type')?.value || 'Android Phone';

      } catch(error){showToast('Registration failed',error.message,'warn');}
    }

    function deleteSelectedDeviceMedia() {
      if (state.selectedMediaIds.length === 0) return;
      const count = state.selectedMediaIds.length;
      state.mediaFiles = state.mediaFiles.filter(m => !state.selectedMediaIds.includes(m.id));

      render();

    // ==========================================
    // STORAGE NETWORK PRIORITY & ROUTING
    // ==========================================
    function movePriority(connId, direction) {
      const eligible = state.connectedAccounts.filter(c => c.priority !== null).sort((a, b) => a.priority - b.priority);
      const idx = eligible.findIndex(c => c.id === connId);
      if (idx === -1) return;
      const swapIdx = idx + direction;
      if (swapIdx < 0 || swapIdx >= eligible.length) return;

      const temp = eligible[idx].priority;
      eligible[idx].priority = eligible[swapIdx].priority;
      eligible[swapIdx].priority = temp;

      eligible.sort((a, b) => a.priority - b.priority).forEach((c, i) => {
        c.priority = i + 1;
        c.role = i === 0 ? 'PRIMARY' : (i === 1 ? 'SECONDARY' : 'ADDITIONAL');
        c.subtitle = i === 0 ? 'Primary Storage' : (i === 1 ? 'Secondary Storage' : 'Future / Overflow Storage');
      });

      showToast('Priority Order Updated', 'Sequential Allocation Manager updated. Old files stay in their original location.', 'info');
      render();
    }

    function updateThreshold(connId, val) {
      const conn = state.connectedAccounts.find(c => c.id === connId);
      if (!conn) return;
      conn.thresholdPct = Math.max(50, Math.min(99, parseInt(val, 10) || 85));
      render();
    }

    function toggleProviderUploadEligible(connId) {
      const conn = state.connectedAccounts.find(c => c.id === connId);
      if (!conn) return;
      conn.enabledForUploads = !conn.enabledForUploads;
      conn.statusBadge = conn.enabledForUploads ? 'Active' : 'Standby';
      render();
    }

    function computeRoutingDecision(fileSizeMB) {
      const sizeGB = fileSizeMB / 1024;
      const candidates = state.connectedAccounts
        .filter(c => c.priority !== null)
        .sort((a, b) => a.priority - b.priority);

      const trace = [];
      let selected = null;

      for (const acc of candidates) {
        const usagePct = acc.totalGB ? ((acc.usedGB + sizeGB) / acc.totalGB) * 100 : 0;
        if (!acc.enabledForUploads) {
          trace.push({ acc, decision: 'STANDBY_SKIPPED', reason: 'Paused / Standby mode' });
          continue;
        }
        if (acc.status !== 'HEALTHY') {
          trace.push({ acc, decision: 'UNAVAILABLE', reason: `Status: ${acc.status}` });
          continue;
        }
        if (acc.totalGB && usagePct > acc.thresholdPct) {
          trace.push({
            acc,
            decision: 'THRESHOLD_FULL_OVERFLOW',
            reason: `Projected ${usagePct.toFixed(1)}% exceeds ${acc.thresholdPct}% limit → Auto-switching to next storage`
          });
          continue;
        }
        if (!selected) {
          selected = acc;
          trace.push({
            acc,
            decision: 'SELECTED_TARGET',
            reason: `Active & within ${acc.thresholdPct}% limit (${usagePct.toFixed(1)}% used)`
          });
        } else {
          trace.push({
            acc,
            decision: 'STANDBY_OVERFLOW',
            reason: 'Not currently receiving backups (Standby reserve)'
          });
        }
      }
      return { selected, trace };
    }

    // ==========================================

    function renderConnectionsTab() {
      return `
        <div class="space-y-6 fade-in">

              <h2 class="text-xl font-bold">Cloud Connections &amp; Provider Catalog (All 9 Providers)</h2>
              <p class="text-xs text-slate-400">
                যেসব Provider-এর বৈধ API ও অনুমোদিত Upload সুবিধা আছে, শুধু সেগুলোই Allocation Manager-এ যুক্ত হয়।

          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">

                        </div>

                    `).join('')}
                  </div>
                  <button disabled aria-disabled="true" title="Backend and provider authorization are not implemented yet" class="w-full py-2.5 px-4 rounded-xl text-xs font-bold bg-slate-800 text-amber-300 opacity-80 cursor-not-allowed">
                    Integration not available yet

      `;
    }

    async function uploadSelectedFile() {
      const input = document.getElementById('upload-file-input');
      const file = input && input.files ? input.files[0] : null;
      if (!file) { showToast('Choose a file', 'Select a file before uploading.', 'warn'); return; }
      if (file.size > 100 * 1024 * 1024) { showToast('File too large', 'The current upload API limit is 100 MB.', 'warn'); return; }
      try {
        const response = await fetch('/api/files/upload', { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': file.type || 'application/octet-stream', 'X-File-Name': encodeURIComponent(file.name) }, body: file });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || 'Upload failed');
        input.value = ''; await refreshCloudData();
        showToast('Upload complete', 'The file was stored in the private R2 bucket.', 'success');
      } catch (error) { showToast('Upload failed', error.message, 'warn'); }
    }
    function renderUnifiedGalleryTab() {
      return `
        <div class="space-y-6 fade-in">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-bold">Private Cloud Files</h2>
              <p class="text-xs text-slate-400">
                Cloudflare R2-তে সংরক্ষিত ফাইলগুলো এখানে দেখা যাবে। বর্তমান আপলোড সীমা 100 MB।

          <div class="flex flex-wrap items-center gap-2"><input id="upload-file-input" type="file" class="max-w-full text-xs text-slate-300" /><button onclick="uploadSelectedFile()" class="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-bold">Upload to R2</button></div>
          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
            ${state.mediaFiles.map(m => `
              <div class="p-4 rounded-2xl bg-[#0a0b0e] border border-slate-800 space-y-3">
                <div class="flex items-center justify-between text-xs">
                  <span class="px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-400 font-mono">Cloudflare R2</span>

            `).join('')}

            <pre class="text-xs font-mono bg-black text-emerald-300 p-4 rounded-2xl overflow-x-auto custom-scroll leading-relaxed">

    // ==========================================
    // MAIN APPLICATION SHELL
    // ==========================================
    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!state.isAuthenticated) {

      }

      if (!state.isVaultUnlocked) {
        app.innerHTML = renderVaultLockScreen();

        { id: 'devices_hub', label: 'Registered Devices (Hub)', icon: '📱', badge: state.devices.length },

                <div class="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center text-slate-950 font-extrabold shadow">
                  ☁️
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-base sm:text-lg tracking-tight">My Private Cloud Hub</span>
                    <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                      PRIVATE ACCOUNT
                    </span>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2">
                <button onclick="lockVaultNow()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-xs font-semibold text-amber-400" title="Cloudflare Worker session">
                  🔒 Session active

                  ${state.darkMode ? '☀️' : '🌙'}
                </button>
                <button onclick="switchTab('security')" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-xs" title="Settings & Security">
                  ⚙️
                </button>
                <button onclick="handleLogout()" class="px-3 py-1.5 rounded-xl bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white text-xs font-semibold">
                  Sign out
                </button>
              </div>
            </div>

            <!-- Navigation Bar -->
            <nav class="max-w-6xl mx-auto flex items-center gap-1.5 overflow-x-auto custom-scroll pt-3 pb-1">
              ${navItems.map(item => `
                <button onclick="switchTab('${item.id}')" class="px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap flex items-center gap-2 transition ${
                  state.currentTab === item.id
                    ? 'bg-emerald-500 text-slate-950 font-bold shadow-sm'
                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-900'
                }">
                  <span>${item.icon}</span>
                  <span>${item.label}</span>
                  ${item.badge !== undefined ? `<span class="px-1.5 py-0.2 rounded-full text-[10px] font-mono ${state.currentTab === item.id ? 'bg-slate-950 text-emerald-400' : 'bg-slate-200 dark:bg-slate-800 text-slate-400'}">${item.badge}</span>` : ''}
                </button>
              `).join('')}
            </nav>
          </header>

          <!-- Main Viewport -->
          <main class="flex-1 max-w-6xl w-full mx-auto px-4 lg:px-8 py-6">

              <strong>Frontend prototype only.</strong> No real sign-in, cloud provider, device, upload, backup, or database is connected.
              ${'<div class="mt-1">Only real records returned by the backend are shown.</div>'}
            </div>
            ${mainContent}
          </main>
        </div>
      `;
    }

    window.onload = bootstrap;
  </script>
